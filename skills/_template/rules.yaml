# Analysis / comparison rules (domain-specific) — Schema: schemas/definitions/analysis-rule.schema.json
# Dùng bởi cross-artifact-analyzer. Tùy chọn: xóa file nếu Skill không có rule liên tài liệu.

owner:
  owner_type: skill
  owner_id: <xx.skill-name>
  owner_version: 0.1.0

rules: []

# Ví dụ cấu trúc (comment):
# - rule_id: XX-YY-R001
