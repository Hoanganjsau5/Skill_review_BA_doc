#   statement: "<điều kiện cần kiểm tra trên tập artifact>"
#   inputs: [<artifact-type>, <artifact-type>]
#   method: "<cách áp dụng>"
#   rationale: "<lý do>"
#   authority_level: industry-best-practice
#   source_refs:
#     - { source_id: SRC-XXXX, locator: "<clause>" }
#   origin_note: null              # bắt buộc nếu authority_level = internal-convention
#   validation: { status: unvalidated, examples: [] }
