# Golden Test Cases for `re.srs-review`
# Covers: required-section defects, navigation defects, two-artifact reference resolution,
# partial-document Not Assessable gate, tailoring false-positive prevention,
# Compliant golden baseline, and cross-skill ownership boundaries (wording -> re.requirement-quality,
# set consistency -> re.requirement-set-quality).

suite_id: re.srs-review.golden-suite
skill_id: re.srs-review
skill_version: 0.1.0
status_enum: [Compliant, Issue, Not Assessable, Not Applicable]

test_cases:
  - test_id: SRV-GTC-01
    scenario: "1. Mandatory Overall-Description subsections absent (Constraints, Assumptions & Dependencies) and Communications/Software interface home missing for a gateway-integrated product (SRV-01, SRV-04)"
    language: en
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      outline_baseline: "Project template not supplied; assumed recognized standard outline (recorded as assumption)"
      extracted_headings:
        - { id: "1", title: "Introduction", body: "substantive" }
        - { id: "1.1", title: "Purpose", body: "substantive" }
        - { id: "1.2", title: "Document Scope", body: "substantive" }
        - { id: "2", title: "Overall Description", body: "substantive" }
        - { id: "2.1", title: "Product Perspective", body: "substantive; names external payment gateway integration" }
        - { id: "2.2", title: "Product Functions", body: "substantive" }
        - { id: "2.3", title: "User Characteristics", body: "substantive" }
        - { id: "3", title: "Specific Requirements", body: "substantive" }
        - { id: "3.1", title: "External Interfaces", body: "subsections: 3.1.1 User Interfaces only" }
        - { id: "3.2", title: "System Features", body: "substantive" }
      tailoring_declaration: null
      open_issues_register: null
    expected_criterion_statuses:
      SRV-01: Issue
      SRV-02: Not Assessable
      SRV-03: Not Assessable
      SRV-04: Issue
      SRV-05: Compliant
      SRV-06: Not Applicable
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings:
      - criterion_id: SRV-01
        rule_ids: [SRV-R001]
        type: gap
        severity: major
        confidence: high
        evidence_excerpt: "Section inventory jumps 2.3 -> 3: no Constraints and no Assumptions/Dependencies sections; no tailoring declaration covers them (baseline: recognized standard outline — assumption recorded)."
      - criterion_id: SRV-04
        rule_ids: [SRV-R005]
        type: gap
        severity: major
        confidence: medium
        evidence_excerpt: "3.1 External Interfaces contains only 3.1.1 User Interfaces; §2.1 product perspective names an external payment gateway, so software/communications interface classes have no structural home and no not-applicable declaration."
      - criterion_id: SRV-02
        rule_ids: [SRV-R002]
        type: observation
        severity: info
        confidence: high
        evidence_excerpt: "Front matter absent from supplied text conversion; revision-history state not confirmable — clarification_request issued for original file. (Not Assessable, no confirmed finding.)"
    explanation: "Tests the skeleton diff (SRV-R001) against an assumed standard outline and the requirement-class coverage audit (SRV-R005), while demonstrating the front-matter Not Assessable path when the supplied conversion lacks the title block. SRV-06 is Not Applicable: document references no external material or appendices."

  - test_id: SRV-GTC-02
    scenario: "2. Vietnamese SRS: renumbered body section without TOC update plus stale internal 'Xem Mục 3.4' reference landing on a different feature (SRV-03)"
    language: vi
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      front_matter:
        document_id: "SRS-TRIPMATE-BOOKING"
        declared_version: "v1.4"
        revision_history: "table present; latest row v1.4 dated 2026-10-30 (agrees with declared version)"
      toc_entries:
        - { number: "3.4", title: "Quản lý thanh toán" }
        - { number: "3.5", title: "Thông báo đẩy" }
      actual_headings:
        - { number: "3.4", title: "Thông báo đẩy", locator: "sec:p34" }
        - { number: "3.5", title: "Quản lý thanh toán", locator: "sec:p35" }
      body_references:
        - { locator: "FR-21 @ sec:p32", text: "Quy trình hoàn tiền xem Mục 3.4." }
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Issue
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Not Applicable
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings:
      - criterion_id: SRV-03
        rule_ids: [SRV-R003, SRV-R004]
        type: inconsistency
        severity: minor
        confidence: high
        evidence_excerpt: "TOC lists '3.4 Quản lý thanh toán' but actual heading 3.4 is 'Thông báo đẩy' (renumbered to 3.5 without TOC update); FR-21's normative reference 'xem Mục 3.4' about refund now resolves to the push-notification section (subject mismatch)."
    explanation: "Tests TOC↔heading reconciliation (SRV-R003) and intra-document reference subject-match (SRV-R004) with two-part evidence in Vietnamese; revision history present and consistent keeps SRV-02 Compliant."

  - test_id: SRV-GTC-03
    scenario: "3. Two-artifact reference resolution: normatively used 'ICD-PAY-02 v1.3' absent from supplied review-corpus inventory, and body invokes 'Appendix D' though appendices end at C (SRV-06)"
    language: en
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      references_list:
        - { id: "[R1]", text: "ICD-PAY-02 v1.3 — Payment Gateway Interface Control Document" }
        - { id: "[R2]", text: "ADR-0007 — Push Notification Provider Selection" }
      body_usage: "FR-33 '…as specified in [R1]'; NFR-08 cites [R2]; 'message schema per Appendix D' cited normatively in 3.4."
      review_corpus_inventory:
        - { file: "ADR-0007", title: "Push Notification Provider Selection", version: "1.0" }
        - { file: "SRS-TRIPMATE-BOOKING", title: "this document", version: "v1.4" }
      appendix_inventory: ["Appendix A — Glossary", "Appendix B — Sample Screens", "Appendix C — Acronyms"]
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Issue
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings:
      - criterion_id: SRV-06
        rule_ids: [SRV-R008]
        type: gap
        severity: major
        confidence: high
        evidence_excerpt: "Artifact 1 (SRS): References entry '[R1] ICD-PAY-02 v1.3' used normatively by FR-33. Artifact 2 (review-corpus inventory): full listing contains ADR-0007 and the SRS itself, no ICD-PAY-02 entry — two-artifact evidence complete per SRV-R008 contract."
      - criterion_id: SRV-06
        rule_ids: [SRV-R009]
        type: gap
        severity: major
        confidence: high
        evidence_excerpt: "Body (3.4): 'message schema per Appendix D' (normative); document appendix inventory ends at 'Appendix C — Acronyms' — invoked appendix does not exist."
    explanation: "Tests the reference/appendix apparatus. Enforces the two-artifact evidence rule: a 'referenced document missing' finding without corpus-side evidence would be a contract violation; here the inventory proves non-resolution. [R2] resolves, demonstrating the compliant half."

  - test_id: SRV-GTC-04
    scenario: "4. Single-section paste guard — only Section 3.5 supplied (document_completeness_mode: partial): all whole-document checks Not Assessable, zero invented defects; local SRV-08 stays assessable (partial-mode gate)"
    language: en
    artifact_type: srs
    input_context:
      document_completeness_mode: partial
      supplied: "Section '3.5 Booking Confirmation' only — substantive requirement statements FR-41..FR-44; preamble of Chapter 3 (from same file) declares 'Chapter 3 contains requirements only, no design'; section contains no design region."
      toc: null
      references_list: null
      review_corpus_inventory: null
      front_matter: null
    expected_criterion_statuses:
      SRV-01: Not Assessable
      SRV-02: Not Assessable
      SRV-03: Not Assessable
      SRV-04: Not Assessable
      SRV-05: Not Assessable
      SRV-06: Not Assessable
      SRV-07: Not Assessable
      SRV-08: Compliant
    expected_findings: []
    explanation: "A single pasted section must NOT yield 'missing sections / missing references / broken TOC' findings: whole-document absence claims are Not Assessable in partial mode, and limitations/clarification_requests ask for the full document, TOC, and corpus inventory. SRV-08 remains assessable because the supplied section and its declared role are both present and agree (requirements-only section carries no design region)."

  - test_id: SRV-GTC-05
    scenario: "5. False-positive prevention — optional interface classes absent but explicitly tailored out with rationale: SRV-04 and SRV-01 Compliant, no Issue (Vietnamese tailoring statement)"
    language: vi
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      extracted_headings: "1/1.1/1.2/2(2.1-2.5)/3(3.1 External Interfaces with 3.1.1 User Interfaces, 3.1.3 Software Interfaces; 3.2 Functional; 3.3 NFR; 3.4 Dữ liệu: 'tham chiếu ERD-TRIPMATE v2.1')"
      tailoring_declaration:
        locator: "§1.6 Tài liệu cắt bớt (Tailoring)"
        text: "Không áp dụng: 3.1.2 Giao diện phần cứng và 3.1.4 Giao diện truyền thông — sản phẩm chỉ là web/mobile, không tương tác thiết bị ngoại vi hay giao thức viễn thông trực tiếp."
      review_corpus_inventory:
        - { file: "ERD-TRIPMATE", title: "TripMate Data Model", version: "2.1" }
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Compliant
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings: []
    explanation: "Absent Hardware/Communications interface sections declared out of scope with rationale in a tailoring section → pass_conditions of SRV-04 met via explicit not-applicable declaration; Data description satisfied by reference to ERD-TRIPMATE, which resolves in the corpus (SRV-06). Flags an Issue here would be the canonical tailoring false positive."

  - test_id: SRV-GTC-06
    scenario: "6. Strict ownership boundary — structurally clean document whose statements are ambiguous/compound: wording defects belong to re.requirement-quality, NOT re.srs-review"
    language: en
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      structure: "Complete skeleton, revision history current, TOC accurate, all classes have homes, ID scheme FR-nn/NFR-nn uniform, references resolve, no placeholders, no design regions."
      sample_statements:
        - { id: FR-12, text: "The system shall load search results quickly and show relevant hotels." }
        - { id: FR-13, text: "The system shall send booking confirmations by email and SMS notification." }
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Compliant
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings: []
    delegation_notes:
      - { delegate_to: re.requirement-quality, basis: "RQ-03 (unambiguous) for FR-12 'quickly/relevant'; RQ-05 (singular) for FR-13 bundling email+SMS obligations", note: "Recorded as scoped observation; this skill emits no wording findings." }
    explanation: "Demonstrates the boundary assigned in re.requirement-quality's own delegation table: per-statement wording stays out of re.srs-review even when discovered during a structure review. Zero SRV findings is the expected result."

  - test_id: SRV-GTC-07
    scenario: "7. Strict ownership boundary — Vietnamese SRS with contradictory peer requirements (refund auto 24h vs manual admin approval) inside a structurally perfect document: set consistency belongs to re.requirement-set-quality"
    language: vi
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      structure: "All SRV-01..SRV-08 structural checks pass (inventory, TOC, references, scheme, appendices clean)."
      sample_statements:
        - { id: FR-07, section: "3.5 Hoàn tiền", text: "Hệ thống tự động hoàn tiền trong vòng 24 giờ sau khi hủy tour đủ điều kiện." }
        - { id: FR-22, section: "3.9 Vận hành", text: "Mọi giao dịch hoàn tiền phải được nhân viên vận hành phê duyệt thủ công trước khi thực hiện." }
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Compliant
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings: []
    delegation_notes:
      - { delegate_to: re.requirement-set-quality, basis: "RSQ-03 (internal consistency) — contradictory refund behavior between FR-07 and FR-22; both statements are individually well-formed", note: "Structural homes exist and numbering is uniform — no document-structure defect to report." }
    explanation: "Inter-requirement contradiction is an emergent set property owned by RSQ-03. re.srs-review sees only that both requirements sit in allocated, consistently numbered sections."

  - test_id: SRV-GTC-08
    scenario: "8. Whole-section placeholders and undeclared deferral plus ID-scheme drift: '3.8 Báo cáo & Thống kê — [TBD]', surviving template instruction, and functional items numbered NF-301 against declared 'FR-nn' scheme (SRV-07, SRV-05)"
    language: vi
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      id_scheme_declaration: "§1.4 Quy ước: yêu cầu chức năng FR-nn (FR-01..FR-99), phi chức năng NFR-nn."
      placeholder_sections:
        - { locator: "sec:3.8", heading: "3.8 Báo cáo & Thống kê", body: "[TBD — sẽ bổ sung sau sprint 5]" }
        - { locator: "sec:3.9", heading: "3.9 Xuất đơn", body: "Mô tả chức năng tại đây. (template instruction text)" }
      open_issues_register: "contains ISS-12 'report export format' only; no entries covering 3.8 or 3.9 deferrals"
      violating_ids:
        - { locator: "sec:3.6", text: "NF-301 — Hệ thống lưu lịch sử tìm kiếm 30 ngày. (functional behavior, wrong prefix)" }
      feature_overview_2_2: "lists 'Báo cáo & Thống kê' and 'Xuất đơn' as declared features (sections exist — allocation mapping intact)"
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Issue
      SRV-06: Compliant
      SRV-07: Issue
      SRV-08: Compliant
    expected_findings:
      - criterion_id: SRV-07
        rule_ids: [SRV-R010]
        type: defect
        severity: major
        confidence: high
        evidence_excerpt: "3.8 body is the bare placeholder '[TBD — sẽ bổ sung sau sprint 5]' with no open-issues register entry; 3.9 still carries template scaffolding 'Mô tả chức năng tại đây.'"
      - criterion_id: SRV-05
        rule_ids: [SRV-R007]
        type: inconsistency
        severity: major
        confidence: high
        evidence_excerpt: "Declared scheme '§1.4: FR-nn functional' violated in 3.6: NF-301 states a functional obligation under the reserved non-functional-looking prefix, undocumented by any per-section scheme."
    explanation: "Tests the section-level placeholder scan (SRV-R010) with register cross-check, and declared-scheme conformity (SRV-R007) without inventing a scheme (the document's own §1.4 is the reference). Feature allocation (SRV-R006) passes: both placeholder features do have structural homes."

  - test_id: SRV-GTC-09
    scenario: "9. Section-level design leakage in a declared requirements-only chapter: normative '3.9 Thiết kế CSDL' (MySQL DDL) and '3.10 Kiến trúc microservices' regions — and the design region replaces the feature's requirements (SRV-08)"
    language: vi
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      chapter_preamble: "§3 opens: 'Chương này chỉ chứa yêu cầu, không chứa thiết kế — thiết kế thuộc SDD-TRIPMATE.'"
      design_regions:
        - { locator: "sec:3.9", heading: "3.9 Thiết kế cơ sở dữ liệu", body: "CREATE TABLE booking (...); InnoDB partitioning spec; index list (normative)." }
        - { locator: "sec:3.10", heading: "3.10 Kiến trúc kỹ thuật", body: "Component diagram + 'Spring Cloud Gateway, gRPC' mandates as the only content for declared feature 'Tích hợp cổng thanh toán' (no WHAT statements present)." }
      feature_overview_2_2: "declares feature 'Tích hợp cổng thanh toán'"
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Compliant
      SRV-07: Compliant
      SRV-08: Issue
    expected_findings:
      - criterion_id: SRV-08
        rule_ids: [SRV-R011]
        type: defect
        severity: minor
        confidence: high
        evidence_excerpt: "Role declaration (ch.3 preamble: 'chỉ chứa yêu cầu, không chứa thiết kế') vs normative design regions 3.9 (DDL) and 3.10 (component mandates). 3.10 is additionally the ONLY content of declared feature 'Tích hợp cổng thanh toán' — the feature's WHAT is nowhere specified (noted as observation per SRV-R011 step 4)."
    explanation: "Tests section-role-vs-content-type discipline (SRV-R011) at whole-region scale. Statement-level premature design would be RQ-02; here the violation is the nested normative DESIGN SECTIONS themselves. The WHAT-gap for the gateway feature is flagged as an observation, not an invented RSQ finding."

  - test_id: SRV-GTC-10
    scenario: "10. Golden compliant baseline — complete, well-formed SRS: every SRV criterion Compliant, zero findings, zero false positives"
    language: en
    artifact_type: srs
    input_context:
      document_completeness_mode: full
      front_matter:
        document_id: "SRS-TRIPMATE-BOOKING"
        declared_version: "v2.0"
        revision_history: "v1.0 2026-08-14 initial; v1.5 2026-09-30 review round 1; v2.0 2026-11-02 approved baseline (latest row matches declared version)"
      outline: "1 Introduction (Purpose, Scope, Definitions/Acronyms, References, Overview); 2 Overall Description (Perspective, Functions, User Characteristics, Constraints, Assumptions & Dependencies); 3 Specific Requirements (3.1 External Interfaces: User/Software/Communications present, Hardware N/A per §1.6 tailoring; 3.2 Features; 3.3 Performance/NFR; 3.4 Data: 'see ERD-TRIPMATE v2.1'); Appendices A-C."
      toc_and_headings: "TOC regenerated at export; all 'see Section x.y' and figure/table references resolve."
      id_scheme: "§1.4 declares FR-nn/NFR-nn/IF-nn; instances conform and sequences continuous."
      feature_allocation: "§2.2 function table maps 1:1 onto §3.2 feature subsections."
      references: "[R1] ICD-PAY-02 v1.5; [R2] ERD-TRIPMATE v2.1; [R3] GDPR (EU) 2016/679 — public regulation cited by title/edition; all present in review_corpus_inventory (external public standards catalogued by identification)."
      placeholders: "none; deferred items ISS-31/ISS-34 recorded in open_issues_register with owners and target releases"
      design_regions: "none inside requirement sections; architecture lives in SDD-TRIPMATE (referenced, informative)."
    expected_criterion_statuses:
      SRV-01: Compliant
      SRV-02: Compliant
      SRV-03: Compliant
      SRV-04: Compliant
      SRV-05: Compliant
      SRV-06: Compliant
      SRV-07: Compliant
      SRV-08: Compliant
    expected_findings: []
    explanation: "The reference gold sample for calibration: full outline conformance, current revision history, synchronized TOC, tailored hardware interfaces, resolvable reference apparatus (including a public regulation accepted by identification alone), uniform declared ID scheme, clean placeholders, and design content kept in its own document."
